name: Validate chart
on:
  pull_request:
    paths:
    - ".github/workflows/validate-chart.yaml"
    - "application/**"
    - "global/**"
    - "argo-cd/**"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validate-charts-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: Helm lint
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Set up Helm
      uses: azure/setup-helm@v4
    - name: Add Helm repositories
      run: |
        helm repo add ingress-nginx https://kubernetes.github.io/ingress-nginx
        helm repo add argo https://argoproj.github.io/argo-helm
        helm repo add jetstack https://charts.jetstack.io
        helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
        helm repo add grafana-community https://grafana-community.github.io/helm-charts
        helm repo add grafana https://grafana.github.io/helm-charts
        helm repo update
    - name: Build chart dependencies
      run: |
        helm dependency build application
        helm dependency build global
        helm dependency build argo-cd
    - name: Lint charts
      run: |
        helm lint application -f application/values-dev.yaml
        helm lint application -f application/values-prod.yaml
        helm lint global
        helm lint argo-cd
    - name: Render application chart
      run: |
        helm template retoday-dev application \
          --namespace retoday-dev \
          --values application/values-dev.yaml \
          --include-crds \
          > /tmp/retoday-dev.yaml

        helm template retoday-prod application \
          --namespace retoday-prod \
          --values application/values-prod.yaml \
          --include-crds \
          > /tmp/retoday-prod.yaml
    - name: Render global chart
      run: |
        helm template retoday-global global \
          --namespace retoday-global \
          --include-crds \
          > /tmp/retoday-global.yaml
    - name: Render ArgoCD chart
      run: |
        helm template argo-cd argo-cd \
          --namespace argo-cd \
          --include-crds \
          > /tmp/argo-cd.yaml
