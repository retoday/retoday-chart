apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.api.name }}
  namespace: {{ .Values.namespace }}
spec:
  selector:
    app.kubernetes.io/component: api
  type: ClusterIP
  ports:
  - name: api
    port: 80
    targetPort: 8080
  - name: actuator
    port: 8081
    targetPort: 8081
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.api.name }}-preview
  namespace: {{ .Values.namespace }}
spec:
  selector:
    app.kubernetes.io/component: api
  type: ClusterIP
  ports:
  - name: api
    port: 80
    targetPort: 8080
  - name: actuator
    port: 8081
    targetPort: 8081
