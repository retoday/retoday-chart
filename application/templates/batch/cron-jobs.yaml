{{- range $name, $job := .Values.batch.jobs }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ $name }}
  namespace: {{ $.Values.namespace }}
  labels:
    app.kubernetes.io/component: batch
spec:
  schedule: {{ $job.schedule }}
  timeZone: {{ $job.timeZone }}
  suspend: {{ $job.suspend | default false }}
  concurrencyPolicy: {{ $job.concurrencyPolicy | default "Forbid" }}
  successfulJobsHistoryLimit: {{ $job.successfulJobsHistoryLimit | default 1 }}
  failedJobsHistoryLimit: {{ $job.failedJobsHistoryLimit | default 3 }}
  jobTemplate:
    spec:
      backoffLimit: {{ $job.backoffLimit | default 1 }}
      {{- with $job.activeDeadlineSeconds }}
      activeDeadlineSeconds: {{ . }}
      {{- end }}
      template:
        metadata:
          labels:
            app.kubernetes.io/component: batch
        spec:
          restartPolicy: Never
          containers:
          - name: {{ $name }}
            image: {{ $.Values.batch.image }}
            imagePullPolicy: Always
            command:
            - /bin/sh
            - -c
            args:
            - |
              set -eu
              scheduled_minutes=${JOB_NAME##*-}

              case "$scheduled_minutes" in
                ''|*[!0-9]*) echo "Invalid CronJob Job name: $JOB_NAME" >&2; exit 1 ;;
              esac

              scheduled_at=$(date -u -d "@$((scheduled_minutes * 60))" +%Y-%m-%dT%H:%M:%SZ)

              exec java -cp @/app/jib-classpath-file com.retoday.batch.BatchApplicationKt \
              "$@" "scheduledAt=${scheduled_at}" "run.id=${POD_NAME}"
            - batch-runner
            {{- range $key, $value := $job.parameters }}
            - {{ $key }}={{ $value }}
            {{- end }}
            env:
            - name: SPRING_PROFILES_ACTIVE
              value: {{ $.Values.env }}
            - name: SPRING_BATCH_JOB_NAME
              value: {{ $job.jobName }}
            - name: CRON_JOB_NAME
              value: {{ $name }}
            - name: JOB_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.labels['batch.kubernetes.io/job-name']
            - name: PROMETHEUS_PUSHGATEWAY_ADDRESS
              value: retoday-global-prometheus-pushgateway.prometheus.svc.cluster.local:9091
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            envFrom:
            - secretRef:
                name: retoday-secret
            resources:
                {{ toYaml ($job.resources | default $.Values.batch.resources) | nindent 16 }}
          imagePullSecrets:
          - name: docker-secret
{{- end }}
