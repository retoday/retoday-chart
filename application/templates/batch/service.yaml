apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.batch.name }}
  namespace: {{ .Values.namespace }}
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/path: /actuator/prometheus
    prometheus.io/port: "8081"
spec:
  selector:
    app.kubernetes.io/component: batch
  type: ClusterIP
  ports:
  - name: actuator
    port: 8081
    targetPort: 8081
