env: dev
namespace: retoday-dev
ingressClassName: nginx
api:
  name: retoday-api
  replicas: 1
  revisionHistoryLimit: 1
  image: re-today.cr.gabiacloud.com/retoday-api:752e800ca21a462ea8a06f10c593b7c2aaa3bfbc
  ingress:
    host: api.dev.re-today.com
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 1Gi
mysql:
  namespaceOverride: retoday-dev
  fullnameOverride: retoday-mysql
  architecture: standalone
  image:
    repository: bitnamilegacy/mysql
    tag: 9.4.0-debian-12-r0
  auth:
    existingSecret: retoday-mysql-secret
    database: retoday
  primary:
    persistence:
      size: 2Gi
    service:
      ports:
        mysql: 3306
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        cpu: 500m
        memory: 1Gi
redis:
  namespaceOverride: retoday-dev
  fullnameOverride: retoday-redis
  architecture: standalone
  auth:
    existingSecret: retoday-redis-secret
  master:
    persistence:
      enabled: false
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 250m
        memory: 256Mi
prometheus:
  server:
    persistentVolume:
      size: 5Gi
    retention: 3d
grafana:
  namespaceOverride: retoday-dev
  fullnameOverride: retoday-grafana
  admin:
    existingSecret: retoday-grafana-secret
  ingress:
    enabled: true
    ingressClassName: nginx
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-staging
      nginx.ingress.kubernetes.io/ssl-redirect: "true"
    hosts:
    - dev.re-today.com
    tls:
    - secretName: retoday-grafana-tls
      hosts:
      - grafana.dev.re-today.com
  persistence:
    size: 1Gi
cert-manager:
  issuer:
    name: letsencrypt-staging
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
