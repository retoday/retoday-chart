env: prod
namespace: retoday-prod
ingressClassName: nginx
api:
  name: retoday-api
  containerName: retoday-api
  replicas: 3
  revisionHistoryLimit: 5
  image: re-today.cr.gabiacloud.com/retoday-api:b6b70469bb76bfb6aa78e649d1a6793e236c1571
  ingress:
    host: api.re-today.com
  resources:
    requests:
      cpu: 250m
      memory: 1Gi
    limits:
      memory: 2Gi
batch:
  name: retoday-batch
  image: re-today.cr.gabiacloud.com/retoday-batch:b6b70469bb76bfb6aa78e649d1a6793e236c1571
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 1Gi
  jobs:
    - name: generate-recap-seoul
      jobName: generateRecapJob
      schedule: "0 0 * * *"
      timeZone: Asia/Seoul
      parameters:
        timeZone: SEOUL
    - name: generate-recap-pacific
      jobName: generateRecapJob
      schedule: "0 0 * * *"
      timeZone: America/Los_Angeles
      parameters:
        timeZone: PACIFIC
mysql:
  namespaceOverride: retoday-prod
  fullnameOverride: retoday-mysql
  architecture: standalone
  image:
    repository: bitnamilegacy/mysql
    tag: 9.4.0-debian-12-r0
  auth:
    existingSecret: retoday-mysql-secret
    database: retoday
  primary:
    persistence:
      size: 15Gi
    service:
      ports:
        mysql: 3306
  resources:
    requests:
      cpu: 250m
      memory: 1Gi
    limits:
      memory: 2Gi
  metrics:
    enabled: true
    image:
      repository: bitnamilegacy/mysqld-exporter
    service:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9104"
    resources:
      requests:
        cpu: 20m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 128Mi
redis:
  namespaceOverride: retoday-prod
  fullnameOverride: retoday-redis
  architecture: standalone
  auth:
    existingSecret: retoday-redis-secret
  master:
    persistence:
      size: 2Gi
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 512Mi
  metrics:
    enabled: true
    image:
      repository: bitnamilegacy/redis-exporter
    service:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9121"
    resources:
      requests:
        cpu: 20m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 128Mi
