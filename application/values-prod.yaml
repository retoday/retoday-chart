env: prod
namespace: retoday-prod
ingressClassName: nginx
api:
  name: retoday-api
  containerName: retoday-api
  replicas: 3
  revisionHistoryLimit: 5
  image:
  ingress:
    host: api.re-today.com
  resources:
    requests:
      cpu: 250m
      memory: 1Gi
    limits:
      memory: 2Gi
mysql:
  namespaceOverride: retoday-prod
  fullnameOverride: retoday-mysql
  architecture: standalone
  image:
    repository: bitnamilegacy/mysql
    tag: 9.4.0-debian-12-r0
  auth:
    existingSecret: retoday-mysql-secret
    database: retoday
  primary:
    persistence:
      size: 15Gi
    service:
      ports:
        mysql: 3306
  resources:
    requests:
      cpu: 250m
      memory: 1Gi
    limits:
      memory: 2Gi
redis:
  namespaceOverride: retoday-prod
  fullnameOverride: retoday-redis
  architecture: standalone
  auth:
    existingSecret: retoday-redis-secret
  master:
    persistence:
      size: 2Gi
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 512Mi
cert-manager:
  issuer:
    name: letsencrypt
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
