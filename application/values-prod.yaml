env: prod
namespace: retoday-prod
ingressClassName: nginx
api:
  name: retoday-api
  containerName: retoday-api
  replicas: 3
  revisionHistoryLimit: 5
  image:
  ingress:
    host: api.re-today.com
mysql:
  namespaceOverride: retoday-prod
  fullnameOverride: retoday-mysql
  architecture: standalone
  image:
    repository: bitnamilegacy/mysql
    tag: 9.4.0-debian-12-r0
  auth:
    existingSecret: retoday-mysql-secret
    database: retoday
  primary:
    persistence:
      size: 30Gi
    service:
      ports:
        mysql: 3306
redis:
  namespaceOverride: retoday-prod
  fullnameOverride: retoday-redis
  architecture: standalone
  auth:
    existingSecret: retoday-redis-secret
  master:
    persistence:
      size: 3Gi
prometheus:
  server:
    persistentVolume:
      size: 10Gi
grafana:
  namespaceOverride: retoday-prod
  fullnameOverride: retoday-grafana
  admin:
    existingSecret: retoday-grafana-secret
  ingress:
    enabled: true
    ingressClassName: nginx
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt
      nginx.ingress.kubernetes.io/ssl-redirect: "true"
    hosts:
    - grafana.re-today.com
    tls:
    - secretName: retoday-grafana-tls
      hosts:
      - grafana.re-today.com
  persistence:
    size: 3Gi
cert-manager:
  issuer:
    name: letsencrypt
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
  sslAnnotations:
    cert-manager.io/cluster-issuer: letsencrypt
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
