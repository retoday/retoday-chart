webhook:
  discord:
    method: POST
    body: |
      {
        "embeds": [
          {
            "title": "{{ .app.metadata.name }} 배포 {{ if and (eq .app.status.operationState.phase "Succeeded") (eq .app.status.health.status "Healthy") }}성공{{ else }}실패{{ end }}",
            "color": {{ if and (eq .app.status.operationState.phase "Succeeded") (eq .app.status.health.status "Healthy") }}13949744{{ else }}16592173{{ end }},
            "fields": [{
              "name": "Sync Status",
              "value": "{{ .app.status.sync.status }}",
              "inline": true
            },
            {
              "name": "Health Status",
              "value": "{{ .app.status.health.status }}",
              "inline": true
            },
            {
              "name": "Repository",
              "value": "{{ .app.spec.source.repoURL }}/commit/{{ .app.status.sync.revision }}"
            }]
          }
        ]
      }
