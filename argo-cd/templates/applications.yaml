{{- range $name, $application := .Values.applications }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ $name }}
  namespace: {{ $.Values.namespace }}
  annotations:
    notifications.argoproj.io/subscribe.sync-operation-change.discord: ""
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: {{ $application.project | default "default" }}
  source:
    repoURL: https://github.com/retoday/retoday-chart
    targetRevision: main
    path: {{ $application.path }}
    helm:
      valueFiles:
      {{- range $valueFile := $application.valueFiles }}
      - {{ $valueFile }}
      {{- end }}
  destination:
    server: https://kubernetes.default.svc
    namespace: {{ $application.namespace }}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
{{- end }}
