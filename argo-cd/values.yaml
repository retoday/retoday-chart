namespace: argo-cd
argo-cd:
  crds:
    keep: true
  namespaceOverride: argo-cd
  global:
    domain: argo-cd.re-today.com
  configs:
    params:
      server.insecure: true
    secret:
      createSecret: false
  dex:
    enabled: false
  server:
    replicas: 1
    ingress:
      enabled: true
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt
        nginx.ingress.kubernetes.io/backend-protocol: HTTP
        nginx.ingress.kubernetes.io/ssl-redirect: true
      ingressClassName: nginx
      hostname: argo-cd.re-today.com
      tls: true
  notifications:
    cm:
      create: false
    secret:
      create: false
applications:
- name: retoday-global
  namespace: retoday-global
  path: global
  valueFiles:
  - values.yaml
- name: retoday-dev
  namespace: retoday-dev
  path: application
  valueFiles:
  - values-dev.yaml
- name: retoday-prod
  namespace: retoday-prod
  path: application
  valueFiles:
  - values-prod.yaml
