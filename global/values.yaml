namespace: retoday-global
ingress-nginx:
  namespaceOverride: ingress-nginx
  controller:
    ingressClass: nginx
    service:
      type: LoadBalancer
      annotations:
        loadbalancer.openstack.org/flavor-id: adc12270-f56a-4ef1-bb00-429aad71ef6e
        loadbalancer.openstack.org/availability-zone: KR1-Zone1-LB
      nodePorts:
        http: 30080
        https: 30443
    admissionWebhooks:
      enabled: false
cert-manager:
  namespace: cert-manager
  crds:
    enabled: true
argo-rollouts:
  namespaceOverride: argo-rollouts
  controller:
    replicas: 1
  dashboard:
    enabled: false
swagger:
  name: swagger
  namespace: swagger
  docsUrl: https://api.dev.re-today.com/docs/api.yaml
  ingress:
    host: swagger.re-today.com
prometheus:
  forceNamespace: prometheus
  server:
    retention: 7d
    persistentVolume:
      size: 15Gi
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        memory: 1Gi
  prometheus-node-exporter:
    namespaceOverride: prometheus
  kube-state-metrics:
    namespaceOverride: prometheus
  alertmanager:
    namespaceOverride: prometheus
    persistence:
      enabled: false
  prometheus-pushgateway:
    enabled: false
loki:
  namespaceOverride: loki
  deploymentMode: SingleBinary
  loki:
    limits_config:
      retention_period: 168h
    compactor:
      retention_enabled: true
      delete_request_store: filesystem
    auth_enabled: false
    commonConfig:
      replication_factor: 1
    storage:
      type: filesystem
    schemaConfig:
      configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  singleBinary:
    replicas: 1
    persistence:
      size: 25Gi
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 768Mi
  read:
    replicas: 0
  write:
    replicas: 0
  backend:
    replicas: 0
  gateway:
    enabled: true
    replicas: 1
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        memory: 128Mi
  chunksCache:
    enabled: false
  resultsCache:
    enabled: false
  memcached:
    enabled: false
  memcachedExporter:
    enabled: false
  lokiCanary:
    enabled: false
  test:
    enabled: false
  monitoring:
    dashboards:
      enabled: false
    rules:
      enabled: false
    serviceMonitor:
      enabled: false
promtail:
  namespace: promtail
  config:
    clients:
    - url: http://retoday-global-loki-gateway.loki.svc.cluster.local/loki/api/v1/push
    snippets:
      extraRelabelConfigs:
      - action: keep
        source_labels:
        - __meta_kubernetes_namespace
        regex: retoday-dev|retoday-prod|ingress-nginx
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      memory: 128Mi
grafana:
  namespaceOverride: grafana
  admin:
    existingSecret: grafana-secret
  datasources:
    datasources.yaml:
      apiVersion: 1
      datasources:
      - name: Prometheus
        type: prometheus
        uid: prometheus
        access: proxy
        url: http://retoday-global-prometheus-server.prometheus.svc.cluster.local
        isDefault: true
      - name: Loki
        type: loki
        uid: loki
        access: proxy
        url: http://retoday-global-loki-gateway.loki.svc.cluster.local
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
      - name: retoday
        orgId: 1
        folder: Retoday
        folderUid: retoday
        type: file
        disableDeletion: false
        allowUiUpdates: true
        options:
          path: /var/lib/grafana/dashboards/retoday
  dashboardsConfigMaps:
    retoday: grafana-dashboard-cm
  ingress:
    enabled: true
    ingressClassName: nginx
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt
      nginx.ingress.kubernetes.io/ssl-redirect: "true"
    hosts:
    - grafana.re-today.com
    tls:
    - secretName: grafana-tls
      hosts:
      - grafana.re-today.com
  persistence:
    size: 1Gi
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 512Mi
